<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>URL 단축기 - QuickLink Suite</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 상단 네비게이션 헤더 -->
  <header class="app-header">
    <div class="header-left">
      <a href="../index.html" class="logo-link" title="메인 홈으로 이동">
        <img src="img/logo.png" alt="Logo" class="logo">
      </a>
      <span class="service-badge">URL Shortener</span>
    </div>
    <nav class="nav-buttons">
      <a href="../index.html" class="nav-btn" id="nav-home-btn" title="메인 홈">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
        <span>홈</span>
      </a>
      <!-- 1. 'QR코드' 버튼과 'URL단축' 버튼 추가 -->
      <a href="../url2qr/index.html" class="nav-btn" id="nav-qr-btn" title="QR코드 생성기로 이동">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M7 7h.01"/><path d="M17 7h.01"/><path d="M7 17h.01"/><path d="M17 17h.01"/></svg>
        <span>QR코드</span>
      </a>
      <a href="./index.html" class="nav-btn active" id="nav-short-btn" title="현재 페이지: URL 단축">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
        <span>URL단축</span>
      </a>
    </nav>
  </header>

  <main class="main-container">
    <div class="card glass animate-fade-in">
      <div class="card-header">
        <div class="icon-circle">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"></path>
            <path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"></path>
          </svg>
        </div>
        <h1 class="card-title">스마트 URL 단축기</h1>
        <p class="card-subtitle">긴 인터넷 주소를 간결하고 공유하기 쉬운 단축 링크로 변환하세요.</p>
      </div>

      <!-- 3-1. 'URL 입력'창, '단축하기' 버튼 -->
      <form id="shorten-form" class="shorten-form" onsubmit="return false;">
        <div class="input-group">
          <div class="input-icon">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <line x1="2" y1="12" x2="22" y2="12"></line>
              <path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"></path>
            </svg>
          </div>
          <input
            type="url"
            id="url-input"
            class="url-input"
            placeholder="단축할 웹사이트 URL을 입력하세요 (예: https://example.com)..."
            autocomplete="off"
            spellcheck="false"
            required
          />
          <button type="button" id="clear-input-btn" class="clear-btn" title="입력 지우기" style="display: none;">
            &times;
          </button>
        </div>

        <!-- 3-2. 입력 필드가 비어있으면 '단축하기'버튼 비활성화 (기본 disabled) -->
        <button type="submit" id="shorten-btn" class="btn btn-primary" disabled>
          <span class="btn-spinner" id="btn-spinner" style="display: none;"></span>
          <span class="btn-text" id="btn-text">단축하기</span>
        </button>
      </form>

      <!-- 에러 알림 메시지 영역 -->
      <div id="error-message" class="error-banner" style="display: none;">
        <span class="error-icon">⚠️</span>
        <span id="error-text">오류가 발생했습니다.</span>
      </div>

      <!-- 3-1, 3-3, 3-4. 읽기 전용 출력 상자 및 복사 버튼 영역 -->
      <div id="result-container" class="result-container result-hidden">
        <div class="result-divider">
          <span>단축 완료</span>
        </div>

        <div class="output-group">
          <label for="output-url" class="output-label">단축된 URL</label>
          <div class="output-wrapper">
            <input
              type="text"
              id="output-url"
              class="output-input"
              readonly
              placeholder="단축된 URL이 여기에 표시됩니다"
            />
            <!-- 3-4. '복사' 버튼 -->
            <button type="button" id="copy-btn" class="btn btn-copy" title="클립보드로 복사">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <rect width="14" height="14" x="8" y="8" rx="2" ry="2"/>
                <path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/>
              </svg>
              <span>복사</span>
            </button>
          </div>
        </div>

        <!-- 부가 액션 버튼들 (QR코드 생성 연계, 새창 열기) -->
        <div class="action-buttons">
          <a id="open-link-btn" href="#" target="_blank" rel="noopener noreferrer" class="btn btn-secondary">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"></path>
              <polyline points="15 3 21 3 21 9"></polyline>
              <line x1="10" y1="14" x2="21" y2="3"></line>
            </svg>
            <span>새 탭에서 열기</span>
          </a>
          <button type="button" id="make-qr-btn" class="btn btn-secondary">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect width="18" height="18" x="3" y="3" rx="2"/>
              <path d="M7 7h.01"/><path d="M17 7h.01"/><path d="M7 17h.01"/><path d="M17 17h.01"/>
            </svg>
            <span>QR코드로 만들기</span>
          </button>
        </div>
      </div>

      <!-- 최근 단축 기록 섹션 -->
      <div id="history-container" class="history-container" style="display: none;">
        <div class="history-header">
          <span class="history-title">최근 단축 기록</span>
          <button type="button" id="clear-history-btn" class="clear-history-btn">기록 삭제</button>
        </div>
        <ul id="history-list" class="history-list"></ul>
      </div>
    </div>
  </main>

  <!-- 토스트 알림창 -->
  <div id="toast" class="toast">
    <span class="toast-icon">✓</span>
    <span id="toast-text" class="toast-text">복사하였습니다</span>
  </div>

  <script src="script.js"></script>
</body>
</html>
