<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR 코드 생성기 - QuickLink Suite</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Pretendard:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- 상단 네비게이션 헤더 -->
  <header class="app-header">
    <div class="header-left">
      <a href="../index.html" class="logo-link" title="메인 홈으로 이동">
        <img src="img/logo.png" alt="Logo" class="logo">
      </a>
      <span class="service-badge">QR Generator</span>
    </div>
    <nav class="nav-buttons">
      <a href="../index.html" class="nav-btn" id="nav-home-btn" title="메인 홈">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
        <span>홈</span>
      </a>
      <!-- 1. 'QR코드' 버튼과 'URL단축' 버튼 -->
      <a href="./index.html" class="nav-btn active" id="nav-qr-btn" title="현재 페이지: QR 코드">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="18" height="18" x="3" y="3" rx="2"/><path d="M7 7h.01"/><path d="M17 7h.01"/><path d="M7 17h.01"/><path d="M17 17h.01"/></svg>
        <span>QR코드</span>
      </a>
      <a href="../urlShort/index.html" class="nav-btn" id="nav-short-btn" title="URL 단축기로 이동">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71"/><path d="M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71"/></svg>
        <span>URL단축</span>
      </a>
    </nav>
  </header>
  
  <main>
    <div id="qr-container" class="qr-hidden">
      <div class="qr-card">
        <div id="qrcode" class="qr-box"></div>
        <p class="instruction">QR코드를 클릭하면 JPG로 다운로드됩니다</p>
      </div>
    </div>
    
    <div id="input-container" class="center-pos">
      <div class="input-wrapper glass">
        <input type="url" id="url-input" placeholder="웹사이트 URL을 입력하세요..." required autocomplete="off" />
        <button id="generate-btn">생성하기</button>
      </div>
    </div>
  </main>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
